# Vendored upstream tree — D09-01 OpenProject 17.9.6
#
# The platform resolves a source in this order: this vendored tree, then a `git clone` of the
# repository named in the catalog. The tree exists because `opf/openproject` ships a **build**
# Dockerfile (`docker/prod/Dockerfile`, a multi-stage Ruby 4 + Node + PostgreSQL compile that takes
# tens of minutes and needs a BuildKit session the deploy-worker's scoped socket proxy refuses) and
# no Compose file at all. Resolving that repository directly therefore reached `apply` and died
# there. The release the platform actually runs is the published all-in-one image
# `openproject/openproject`, which is what this file pins.
#
# Provenance: the all-in-one image published by OpenProject
# (`openproject/openproject:17.9.6`, GitHub release v17.9.6, 2026-10-30, digest
# `sha256:c4802aca…ff98`). The image bundles PostgreSQL 17, memcached, Apache and the Rails/Puma
# application under supervisord, so the definition is one service; the entry's declared `database`,
# `cache` and `worker` roles are served inside it and must not be provisioned again.
#
# Deliberate choices, each recorded rather than hidden:
#   1. the image is pinned by version **and digest** — the platform refuses a floating tag before
#      apply (compose policy `unpinned_image`), and the digest is the artefact review approved;
#   2. the service declares `expose: ['80']` and never publishes a host port. The platform policy
#      rewrites `ports:` to `expose:` anyway; stating it directly keeps a manual
#      `docker compose up` from binding a plain-HTTP listener outside the edge. The catalogue
#      `httpPort` is therefore **80** (the container port), not 8080;
#   3. only the two directories the image documents are mounted — `/var/openproject/pgdata` (the
#      bundled cluster) and `/var/openproject/assets` (attachments, git/svn repositories). The
#      application tree is never mounted, so the image owns `/app`;
#   4. `SECRET_KEY_BASE` and `OPENPROJECT_SEED__ADMIN__USER__PASSWORD` have no safe default upstream
#      (`OVERWRITE_ME` and `admin` respectively) and are required secrets in the environment
#      declaration; the platform injects them as `environment` entries at apply time, which beats
#      this file's interpolation and keeps the values out of the render set;
#   5. the healthcheck asks the application, not the socket: `/health_checks/default` is
#      OkComputer's own readiness check and stays red until migrations and the seed have finished,
#      whereas a TCP probe would report the Apache listener as healthy during a first-boot install
#      that is still running. `start_period: 900s` covers a first install on a small shape. The
#      probe asserts a literal `200` (a redirect is not readiness) and sends the route `Host` plus
#      the same `X-Forwarded-Proto` the edge sends;
#   6. TLS ends at the edge. `OPENPROJECT_HTTPS=true` is what makes Rails build `https` links when
#      no request is available (mail, exports) and mark session cookies `Secure`. `OPENPROJECT_HSTS`
#      stays **false** because the edge owns the HSTS header and the http→https redirect, and Rails
#      must not redirect the internal plain-HTTP calls the relay's admin API client makes on the
#      instance network (it does not send `X-Forwarded-Proto`; the login driver does, and Rails
#      exempts `/health_checks` from the redirect either way). The D09-01 edge router carries
#      `stsSeconds: 31536000; includeSubDomains`.
#
# The Compose project name is not set here: the renderer writes `name: <slug>`, so two instances of
# the same product cannot share volumes or a network.

services:
  openproject:
    image: openproject/openproject:17.9.6@sha256:c4802aca392506c389ff10a2766caf949000383f20ac752ee5913e1793fdff98
    environment:
      # Absolute URLs and the host Rails accepts; must equal the published route host. A bare host:
      # a scheme or port here is copied into Rails' host allowlist and answers 400 on every request.
      OPENPROJECT_HOST__NAME: ${OPENPROJECT_HOST__NAME:-openproject.seamnex.localhost}
      # The browser speaks https to the edge; TLS is terminated there (see header item 6).
      OPENPROJECT_HTTPS: ${OPENPROJECT_HTTPS:-true}
      # The edge emits HSTS and owns the redirect; Rails must not redirect the internal HTTP hop.
      OPENPROJECT_HSTS: ${OPENPROJECT_HSTS:-false}
      # Apache's ServerName (`docker/prod/proxy.conf.erb`); the vhost and the Rails host agree.
      SERVER_NAME: ${SERVER_NAME:-openproject.seamnex.localhost}
      # Rails refuses to boot a production app without this; there is no safe default.
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?SECRET_KEY_BASE is required — declare it in catalog/env/D09-01.json}
      # Without this the seeder applies its documented `admin` default, and it is read only once.
      OPENPROJECT_SEED__ADMIN__USER__PASSWORD: ${OPENPROJECT_SEED__ADMIN__USER__PASSWORD:?OPENPROJECT_SEED__ADMIN__USER__PASSWORD is required — declare it in catalog/env/D09-01.json}
      # The relay mints its provisioning token through this account, which a forced change blocks.
      OPENPROJECT_SEED__ADMIN__USER__PASSWORD__RESET: ${OPENPROJECT_SEED__ADMIN__USER__PASSWORD__RESET:-false}
    volumes:
      - pgdata:/var/openproject/pgdata
      - assets:/var/openproject/assets
    expose:
      - '80'
    healthcheck:
      # The Host header is not optional: Apache's `_default_` vhost serves a static placeholder and
      # answers 404 for this path. The probe must exercise the vhost the edge proxies to.
      test:
        - CMD-SHELL
        - 'curl -s -o /dev/null -w "%{http_code}" -H "X-Forwarded-Proto: https" -H "Host: $${SERVER_NAME}" http://127.0.0.1:80/health_checks/default | grep -qx 200'
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 900s
    # PostgreSQL and Puma both want an orderly shutdown; the default 10 s truncates it.
    stop_grace_period: 60s
    restart: unless-stopped

volumes:
  pgdata:
  assets:
