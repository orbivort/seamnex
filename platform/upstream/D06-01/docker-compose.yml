# Vendored upstream tree — D06-01 ERPNext 16.53.0
#
# Provenance: `frappe_docker` publishes the reviewed Compose layout
# (`compose.yaml` + `compose.mariadb.yaml` + `compose.redis.yaml`) and the image
# `frappe/erpnext`, which contains both roles the platform needs: `start.sh`
# (gunicorn, port 8000) and `nginx-entrypoint.sh` (nginx, port 8080). The
# application repository `frappe/erpnext` ships no Compose file at all, which is
# why `packagingSource` names this vendored tree rather than the repository.
#
# Deviations from the upstream reference layout, each recorded rather than hidden:
#
#   1. The `configurator` one-shot service is folded into the backend's start-up
#      script. The platform's `verify` stage requires *every* container of the
#      instance to be `running`; a service that exits successfully
#      (`service_completed_successfully`) is exactly the shape it cannot accept.
#   2. `bench new-site` — a manual step in the reference documentation — is run
#      on first boot instead. Without it the image starts nginx in front of an
#      empty sites volume, and every request answers "site not found": a
#      deployment that reports ready without deploying (the D07-01 failure mode).
#   3. `pull_policy: always` is dropped. The deploy engine reaches the daemon
#      through the socket proxy and the images are pinned by tag; a forced pull
#      only adds a registry round trip inside the apply stage.
#   4. `platform: linux/amd64` is not pinned. The image is multi-arch and the
#      host decides; pinning an architecture would force emulation on the hosts
#      that do not need it.
#   5. No service publishes a port. The platform rewrites `ports:` into
#      `expose:` anyway, and the edge reaches the product at
#      `http://<slug>:8080` over the instance network.
#
# Two properties are load-bearing and easy to break:
#
#   - `FRAPPE_SITE_NAME_HEADER` is a *literal site name*, not `$host`. It is
#     used three ways by the image's nginx template (`server_name`, the
#     `X-Frappe-Site-Name` upstream header, and `try_files /<site>/public/...`).
#     A single-site ERPNext behind one platform route therefore pins it to
#     `ERPNEXT_SITE_NAME`, kept equal to the route host
#     (`<slug>.<SEAMNEX_INGRESS_DOMAIN>`).
#   - the URLs the product *prints* are a different value: `host_name`, written
#     here from `ERPNEXT_SITE_ORIGIN` on every start. A Frappe site name cannot
#     carry a scheme or a port, so deriving the origin from it produced
#     `http://<site>` on an edge that serves `https` on `:8443`.
#   - every interpolation intended for the container shell is written `$$`, so
#     Compose leaves it alone and the value is resolved from the *injected*
#     environment at run time instead of being baked into the command line.
#
# `container_name` is absent on purpose: the platform strips it anyway (two
# instances of the same product would collide) and the removal is recorded as a
# normalisation patch.
name: erpnext

services:
  erpnext-db:
    image: mariadb:11.4
    # ERPNext's schema assumes utf8mb4 and a server-side collation; without these
    # flags `bench new-site` succeeds but the first migration fails on an index
    # key that is longer than the 767-byte limit of the default collation.
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      # No fallback: `${...:-root}` is the kind of default that gives every
      # instance of every product the same superuser password. The catalog
      # declares this variable required and secret.
      MARIADB_ROOT_PASSWORD: ${ERPNEXT_DATABASE_ROOT_PASSWORD:?ERPNEXT_DATABASE_ROOT_PASSWORD must be supplied}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  erpnext-redis-cache:
    image: redis:7-alpine
    # No persistence: both Redis instances hold cache and queue state that
    # ERPNext rebuilds, and an appendonly file in a named volume only makes a
    # stale queue replay after a restart.
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    restart: unless-stopped

  erpnext-redis-queue:
    image: redis:7-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    restart: unless-stopped

  erpnext-backend:
    image: frappe/erpnext:v16.53.0
    depends_on:
      erpnext-db:
        condition: service_healthy
      erpnext-redis-cache:
        condition: service_started
      erpnext-redis-queue:
        condition: service_started
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    # First-boot bootstrap, then the image's own gunicorn command. The script is
    # idempotent: a restart (or a platform reconfigure) sees `.seamnex-ready` and
    # goes straight to gunicorn, and a crash *during* the install is finished
    # off instead of failing forever against "site already exists".
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        cd /home/frappe/frappe-bench

        SITE="$$ERPNEXT_SITE_NAME"
        ORIGIN="$$ERPNEXT_SITE_ORIGIN"
        DB_HOST="$$ERPNEXT_DATABASE_HOST"
        DB_PORT="$$ERPNEXT_DATABASE_PORT"
        CACHE="$$ERPNEXT_REDIS_CACHE"
        QUEUE="$$ERPNEXT_REDIS_QUEUE"

        mkdir -p sites
        ls -1 apps > sites/apps.txt

        bench set-config -g db_host "$$DB_HOST"
        bench set-config -gp db_port "$$DB_PORT"
        bench set-config -g redis_cache "$$CACHE"
        bench set-config -g redis_queue "$$QUEUE"
        # socket.io pub/sub rides the cache instance, which is where Frappe's own fallback puts it
        # (`redis_socketio` defaults to `redis_cache`). Pointing it at the queue instance instead made
        # a queue purge drop every open realtime channel, and contradicted what the catalog declares
        # the cache URL is used for.
        bench set-config -g redis_socketio "$$CACHE"
        bench set-config -gp socketio_port 9000

        if [ ! -f "sites/$$SITE/.seamnex-ready" ]; then
          if [ ! -d "sites/$$SITE" ]; then
            echo "[seamnex] creating site $$SITE on $$DB_HOST:$$DB_PORT"
            bench new-site \
              --db-host "$$DB_HOST" \
              --db-port "$$DB_PORT" \
              --mariadb-root-password "$$ERPNEXT_DATABASE_ROOT_PASSWORD" \
              --admin-password "$$ERPNEXT_ADMIN_PASSWORD" \
              --install-app erpnext \
              --set-default \
              "$$SITE"
          else
            echo "[seamnex] site $$SITE exists without a ready marker; completing the install"
            bench --site "$$SITE" install-app erpnext
            echo "$$SITE" > sites/currentsite.txt
          fi
          touch "sites/$$SITE/.seamnex-ready"
          echo "[seamnex] site $$SITE ready"
        fi

        # The site's database account is converged for the address this container has *now*.
        #
        # `bench new-site` does not create `'user'@'%'`: `DbManager.create_user` defaults the host to
        # `SELECT user()` of the connection that ran it, which is this container's address on the
        # instance network. A container that is recreated — reconfigure, upgrade, a route change —
        # gets a new address, and from then on every request answers
        # `Access denied for user '…'@'…'`, because nothing re-runs `bench new-site` while
        # `.seamnex-ready` exists and the account is bound to an address nothing answers from any
        # more. It surfaced the first time this instance was reconfigured after deployment, as a
        # backend that never became healthy.
        #
        # Frappe's own privilege list is `ALL PRIVILEGES` on the site's own schema whenever `rds_db`
        # is off, so this grants exactly what the installer would have; the account keeps its
        # generated password, read back from `site_config.json`.
        if [ -f "sites/$$SITE/site_config.json" ]; then
          env/bin/python - <<'PY'
        import json
        import os

        import MySQLdb

        site = os.environ["ERPNEXT_SITE_NAME"]
        config = json.load(
            open(os.path.join("/home/frappe/frappe-bench/sites", site, "site_config.json"))
        )
        user = config["db_user"]
        database = config["db_name"]
        connection = MySQLdb.connect(
            host=config["db_host"],
            port=int(config.get("db_port") or 3306),
            user="root",
            passwd=os.environ.get("ERPNEXT_DATABASE_ROOT_PASSWORD", ""),
        )
        try:
            cursor = connection.cursor()
            cursor.execute("SELECT SUBSTRING_INDEX(USER(), '@', -1)")
            host = cursor.fetchone()[0]
            cursor.execute(
                "CREATE USER IF NOT EXISTS %s@%s IDENTIFIED BY %s", (user, host, config["db_password"])
            )
            cursor.execute(f"GRANT ALL PRIVILEGES ON `{database}`.* TO %s@%s", (user, host))
            connection.commit()
            print(f"[seamnex] database account {user}@{host} converged")
        finally:
            connection.close()
        PY
        fi

        # Outside the guard on purpose. `host_name` is site-scoped, not global, and it is the base of
        # every absolute URL the product prints; written once on first boot it kept the origin of the
        # day the site was created, so a route change left reset links, notification bodies and export
        # downloads pointing at a host the browser no longer reaches.
        bench --site "$$SITE" set-config host_name "$$ORIGIN"

        # Native single sign-on (FR-2.16). Frappe keeps its identity-provider settings in a
        # `Social Login Key` row on the site, not in the environment, so unlike EspoCRM's
        # `ESPOCRM_CONFIG_*` variables nothing the platform injects reaches the product by itself:
        # this script is the only thing that can apply the declaration. It runs on every start, so a
        # route change moves `redirect_url` with the site and an operator's change reaches a running
        # instance at its next restart.
        #
        # Full source, not `bench execute`: the client secret arrives in the environment, and passing
        # it through `--kwargs` would mean quoting it into a shell string. The site context Frappe
        # needs is what `frappe.init` + `frappe.connect` set up, and the writes are ordinary
        # document saves, so no schema or permission bypass is involved beyond `ignore_permissions`
        # (the script runs as `Administrator` with no session).
        env/bin/python - <<'PY'
        import json
        import os
        import sys

        import frappe

        def env(name, default=None):
            value = os.environ.get(name, default)
            return value.strip() if isinstance(value, str) else value

        # Fallback first, and deliberately before anything touches the database: with the switch off,
        # or with no secret to present, the site is left exactly as the installer made it. A
        # half-configured provider is worse than none — Frappe would render a button that fails at
        # the provider, and the operator would lose the password form they still need.
        if env("ERPNEXT_SSO_ENABLED", "false").lower() != "true":
            sys.exit(0)
        secret = env("ERPNEXT_SSO_CLIENT_SECRET", "")
        if not secret:
            sys.exit(0)

        site = env("ERPNEXT_SITE_NAME")
        origin = env("ERPNEXT_SITE_ORIGIN")

        # Frappe resolves its *file* logging relative to the process working directory:
        # `create_handler` opens `../logs/<module>.log`. `bench` gets away with that by moving into
        # `sites/` first, which is why the CLI in the block above is fine. This heredoc inherits the
        # image's working directory (`/home/frappe/frappe-bench`), where `../logs` is `/home/frappe/logs`
        # — a directory the image does not have, so the first `frappe.connect()` raised
        # `FileNotFoundError: '/home/frappe/logs/database.log'` and the container never became healthy.
        # Nothing here needed the database, so the whole block was latent until the secret started
        # arriving: the failure appeared the first time a site was actually configured.
        sites_path = "/home/frappe/frappe-bench/sites"
        os.chdir(sites_path)

        frappe.init(site=site, sites_path=sites_path)
        frappe.connect()
        frappe.set_user("Administrator")

        try:
            # `Keycloak` is a first-class provider option in the doctype, so the callback Frappe will
            # be sent back to is `login_via_keycloak` — the same path the platform registered.
            values = {
                "enable_social_login": 1,
                "client_id": env("ERPNEXT_SSO_CLIENT_ID"),
                "client_secret": secret,
                "base_url": env("ERPNEXT_SSO_BASE_URL"),
                "authorize_url": env("ERPNEXT_SSO_AUTHORIZE_URL"),
                "access_token_url": env("ERPNEXT_SSO_TOKEN_URL"),
                "api_endpoint": env("ERPNEXT_SSO_USERINFO_URL"),
                # Absolute, and built from the same two pieces the platform used for the registered
                # redirect URI: the route origin and this path. Relative would make Frappe join it
                # onto `host_name` at request time, a third derivation that can disagree.
                "redirect_url": origin
                + "/api/method/frappe.integrations.oauth2_logins.login_via_keycloak",
                "user_id_property": env("ERPNEXT_SSO_USER_ID_PROPERTY", "sub"),
                # `response_type` is not optional: rauth's `get_authorize_url` adds only `client_id`,
                # so whatever this JSON omits is simply absent from the URL the browser follows.
                # Without `code`, Keycloak answers "Invalid parameter: response_type" and the button
                # leads to an error page instead of a login. Frappe's own Keycloak template carries
                # the same pair.
                "auth_url_data": json.dumps(
                    {
                        "response_type": "code",
                        "scope": env("ERPNEXT_SSO_SCOPE", "openid profile email"),
                    }
                ),
                "sign_ups": env("ERPNEXT_SSO_SIGN_UPS", "Allow"),
                "show_in_resource_metadata": 1,
                # The three endpoint fields above are absolute, so no base is prepended.
                "custom_base_url": 0,
            }

            # The document must be *named* `keycloak`, and that is a property of the provider, not a
            # cosmetic choice. Frappe's `login_via_keycloak` entry point calls
            # `login_via_oauth2("keycloak", …)`, and everything downstream resolves the provider by the
            # document name: `get_oauth2_providers()` is keyed by it, and `get_oauth_keys`,
            # `get_redirect_uri`, `provider_allows_signup` and `update_oauth_user` all look that key up
            # in the database. `autoname` scrubs `provider_name`, so `provider_name = "Keycloak"` is
            # what produces the name `keycloak`. The previous `"seamnex"` produced a document the
            # sign-in button could reach and the callback could not: the browser came back with a code
            # and the callback raised `KeyError: 'keycloak'`.
            #
            # A row left by that version is removed, not repaired: `provider_name` and
            # `social_login_provider` are `set_only_once`, so an existing document cannot be corrected
            # in place. Nothing is lost by deleting it — this bootstrap owns every field of the row.
            for legacy in frappe.get_all(
                "Social Login Key",
                filters={"social_login_provider": "Keycloak"},
                pluck="name",
            ):
                if legacy != "keycloak":
                    frappe.delete_doc(
                        "Social Login Key", legacy, force=True, ignore_permissions=True
                    )

            if frappe.db.exists("Social Login Key", "keycloak"):
                doc = frappe.get_doc("Social Login Key", "keycloak")
                doc.update(values)
                doc.save(ignore_permissions=True)
            else:
                doc = frappe.new_doc("Social Login Key")
                doc.update(values)
                doc.provider_name = "Keycloak"
                doc.social_login_provider = "Keycloak"
                doc.insert(ignore_permissions=True)

            # Session handling: `session_expiry` is the only session-length setting Frappe has, and
            # the entry's `sessionMaxMinutes` claim is only true while it agrees with this value.
            frappe.db.set_single_value(
                "System Settings", "session_expiry", env("ERPNEXT_SESSION_EXPIRY", "08:00:00")
            )
            # Fallback behaviour: the password form stays unless the operator turned it off, so an
            # IdP outage never strands the administrator who has to repair the site.
            frappe.db.set_single_value(
                "System Settings",
                "disable_user_pass_login",
                1 if env("ERPNEXT_SSO_DISABLE_LOCAL_LOGIN", "false").lower() == "true" else 0,
            )
            # Role mapping — the single hook Frappe offers. It is applied when the login flow creates
            # the user, never afterwards, so a change here reaches only accounts created from now on.
            role = env("ERPNEXT_SSO_DEFAULT_ROLE", "")
            if role:
                frappe.db.set_single_value("Portal Settings", "default_role", role)

            frappe.db.commit()
            frappe.clear_cache()
            print("[seamnex] social login key applied for " + site)
        finally:
            frappe.destroy()
        PY

        exec /usr/local/bin/start.sh
    healthcheck:
      # The marker, not an HTTP probe: gunicorn answers `/api/method/ping` with a
      # 404 for a site that is not installed yet, so an HTTP probe would either
      # declare a half-installed site healthy or need a second, product-aware
      # check in the platform. This one states the fact the frontend waits for.
      test: ['CMD-SHELL', 'test -f "/home/frappe/frappe-bench/sites/$$ERPNEXT_SITE_NAME/.seamnex-ready"']
      interval: 10s
      timeout: 5s
      retries: 6
      # A first install of ERPNext migrates a few hundred doctypes; the start
      # period keeps the container in `starting` (never `unhealthy`) while it
      # does, which is what the platform's verify stage reads.
      start_period: 1500s
    restart: unless-stopped

  erpnext-websocket:
    image: frappe/erpnext:v16.53.0
    command: ['node', '/home/frappe/frappe-bench/apps/frappe/socketio.js']
    depends_on:
      erpnext-backend:
        condition: service_healthy
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    restart: unless-stopped

  erpnext-worker-short:
    image: frappe/erpnext:v16.53.0
    command: ['bench', 'worker', '--queue', 'short,default']
    depends_on:
      erpnext-backend:
        condition: service_healthy
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    restart: unless-stopped

  erpnext-worker-long:
    image: frappe/erpnext:v16.53.0
    command: ['bench', 'worker', '--queue', 'long,default']
    depends_on:
      erpnext-backend:
        condition: service_healthy
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    restart: unless-stopped

  erpnext-scheduler:
    image: frappe/erpnext:v16.53.0
    command: ['bench', 'schedule']
    depends_on:
      erpnext-backend:
        condition: service_healthy
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    restart: unless-stopped

  # The one service that answers on the product's HTTP port. The platform
  # attaches the instance's network alias (`<slug>`) to whichever service
  # `expose`s `httpPort`, so this is the container the route and the readiness
  # probe address.
  erpnext:
    image: frappe/erpnext:v16.53.0
    command: ['nginx-entrypoint.sh']
    environment:
      BACKEND: erpnext-backend:8000
      SOCKETIO: erpnext-websocket:9000
      NGINX_LISTEN_PORT: '8080'
      FRAPPE_SITE_NAME_HEADER: ${ERPNEXT_SITE_NAME:?ERPNEXT_SITE_NAME must be supplied}
      PROXY_READ_TIMEOUT: '120'
      CLIENT_MAX_BODY_SIZE: '50m'
    expose: ['8080']
    depends_on:
      erpnext-backend:
        condition: service_healthy
      erpnext-websocket:
        condition: service_started
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    restart: unless-stopped

volumes:
  sites:
  db-data:
