# Phase 1 baseline (deliverable 1.10) plus the per-instance targets M21 generates (FR-2.6, AC-45).
#
# The platform job scrapes the API's own registry; the `seamnex-instance` job scrapes one target per
# instance from the `file_sd` directory M21 writes. Prometheus watches that directory, so publishing a
# target needs no reload endpoint — which is the point: there is no second write path to secure.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: seamnex-dev

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: seamnex-api
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ['api:8080']
        labels:
          role: api

  # FR-2.6 — one target per live instance, published by M21 (`instance-<id>.json`). Each target's
  # `__metrics_path__` label points at that instance's series, so the label set here stays fixed and
  # a deleted instance's file is removed by the same reconciliation pass that wrote it.
  - job_name: seamnex-instance
    file_sd_configs:
      - files: ['/etc/prometheus/targets/instance-*.json']
        refresh_interval: 30s

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']
