# Phase 1 baseline (deliverable 1.10). Per-instance scrape targets are generated by M21 in Phase 6;
# this file only describes the platform itself.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: seamnex-dev

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: seamnex-api
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ['api:8080']
        labels:
          role: api

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']
