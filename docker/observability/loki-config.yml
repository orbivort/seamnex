# Single-binary Loki for development. The platform's own audit log, not Loki, is the record of what
# happened; retention here is the log *query* window the platform promises (NFR-6.7 / AC-45), which
# is thirty days. The previous 168 h made "queryable per instance" true for a week only.
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # 30 days: the floor `SEAMNEX_OBSERVABILITY_RETENTION_DAYS` is validated against.
  retention_period: 720h
  reject_old_samples: false

compactor:
  working_directory: /loki/compactor
  delete_request_store: filesystem
  retention_enabled: true
