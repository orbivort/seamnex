packages:
  - 'apps/*'
  - 'packages/*'

# Node version enforcement. `engines.node`/`devEngines` in package.json state the
# requirement; this makes a violation fail the install instead of surfacing later
# as a runtime syntax error from an ES2025 built-in. Kept here rather than in an
# `.npmrc` so every registry/version policy stays in one file.
engineStrict: true

# The single source of every external version. `catalogMode: strict` below keeps it
# that way: `pnpm add` writes the new pin here and references it from the manifest,
# so a version range never lands in a package.json.
catalog:
  '@aws-sdk/client-s3': 3.1168.0
  '@eslint/js': 10.0.1
  '@nestjs/common': 12.5.0
  '@nestjs/core': 12.5.0
  '@nestjs/platform-fastify': 12.5.0
  '@tailwindcss/vite': 4.3.5
  '@tanstack/react-query': 5.107.1
  '@testing-library/react': 16.3.3
  '@types/dockerode': 4.0.2
  '@types/node': 24.19.2
  '@types/pg': 8.23.1
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@vitejs/plugin-react': 6.3.0
  '@vitest/coverage-v8': 5.1.0
  bullmq: 6.7.6
  class-variance-authority: 0.7.1
  clsx: 2.1.1
  dockerode: 5.0.1
  eslint: 10.14.0
  eslint-plugin-jsx-a11y: 6.10.2
  eslint-plugin-n: 18.5.0
  eslint-plugin-react-hooks: 7.1.1
  eslint-plugin-security: 4.2.1
  fastify: 5.12.8
  globals: 17.14.0
  ioredis: 6.0.0
  jsdom: 31.0.1
  lucide-react: 1.72.0
  msw: 3.0.5
  pg: 8.23.1
  pino: 10.4.0
  prettier: 3.10.1
  prom-client: 15.1.3
  radix-ui: 1.8.1
  react: 19.3.1
  react-dom: 19.3.1
  react-router: 8.5.1
  reflect-metadata: 0.2.2
  rxjs: 7.8.2
  stylelint: 18.0.0
  stylelint-config-standard: 41.0.0
  tailwind-merge: 3.7.0
  tailwindcss: 4.3.5
  tsx: 4.23.15
  turbo: 2.11.11
  typescript: 6.0.3
  typescript-eslint: 8.72.2
  vite: 8.3.8
  vitest: 5.1.0
  yaml: 2.9.1
  zod: 4.6.7

# 1. `catalogMode` defaults to `manual`, which lets `pnpm add` write a `^` range
# straight into a package manifest — the drift the catalog exists to prevent.
# Under `strict` the version goes into the catalog instead and the manifest only
# records `catalog:`, so every external version stays in one file.
#
# 2. `savePrefix: ''` is what makes that pin exact: the version `pnpm add` writes
# to the catalog carries no `^`, matching every pin already there.
catalogMode: strict
savePrefix: ''

# Supply-chain delay: a release must be a day old before it can be installed,
# which covers the window in which a compromised publish is normally consumed.
# Setting the age explicitly enables the strict variant by default; `false` keeps
# the delay as a preference rather than turning a same-day Renovate bump into a
# red `pnpm install` on main.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: false

# An advisory whose dependents still ask for a vulnerable range. Pinned to the patched release here
# rather than by bumping a dependent, because eslint has no release that widens its own range yet.
# Remove an entry when its dependent does.
overrides:
  # GHSA-g3hv-75wg-m249 — eslint 10.14.0, @eslint/config-array and
  # @typescript-eslint/typescript-estree resolve minimatch ^10, before the globparts amplification
  # fix. 11 is API-compatible and dual-published, which is what keeps eslint's `require` working.
  # minimatch 3 (eslint-plugin-jsx-a11y) sits outside the advisory and is left alone on purpose.
  'minimatch@>=7.0.0 <11.0.1': 11.0.8

# A package that loses its provenance/trusted-publisher status between releases
# is a signal worth stopping on, not a routine version bump. Releases older than a
# year predate provenance entirely, so the check is not applied to them: it would
# flag every legacy pin (`semver@6.3.1`) as a takeover and say nothing useful.
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 525600

# An entry nothing references is dead weight the next reader has to reason about;
# pruning it on install keeps the catalog a list of what the workspace uses.
cleanupUnusedCatalogs: true

allowBuilds:
  esbuild: true
  '@tailwindcss/oxide': true
  # Optional native accelerator for BullMQ's msgpack; the pure-JS fallback is used on this host.
  msgpackr-extract: false
  cpu-features: true
  protobufjs: true
  ssh2: true

minimumReleaseAgeExclude:
  - '@aws-sdk/client-s3@3.1168.0'
  - '@nestjs/common@12.5.0'
  - '@nestjs/core@12.5.0'
  - '@nestjs/platform-fastify@12.5.0'
  - bullmq@6.7.6
  - jsdom@31.0.1
  - prettier@3.10.1
