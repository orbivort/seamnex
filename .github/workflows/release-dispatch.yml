name: release-dispatch

# The manual entrypoint to `release.yml`. A maintainer states the version, or leaves it blank and the
# pipeline reads the one the tree states — the number the bump pull request put there — and can ask
# for a dry run. It covers what `release-auto.yml` cannot: a rehearsal, and a retry after an automatic
# release failed, since a retry changes no version and so produces no `push` to react to.
#
# It has no jobs of its own beyond the call. It used to restate `package`, `tag` and `publish`; those
# live in `release.yml` now, so a manual release cannot be a different release from an automatic one.
# Nothing here creates the tag: `release.yml` writes it last, after the gates and the packaging, which
# is also why a tag pushed with `secrets.GITHUB_TOKEN` is never needed to re-enter this repository.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release: X.Y.Z or X.Y.Z-rc.N (a leading "v" is optional; blank: the version the tree states)'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Run every gate and build the artefacts, but do not tag or publish'
        required: false
        type: boolean
        default: false

# One manual release at a time, and never cancel a run that is halfway through uploading assets: a
# cancelled publish leaves a release carrying only some of its files. The pipeline itself refuses a
# version whose tag or release exists, so this group and `release-auto.yml`'s cannot address the same
# version even when they run close together.
concurrency:
  group: release-dispatch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: tag and publish
    # The called workflow writes a tag and a release, so the caller has to grant both; each job inside
    # it narrows that back down to what it uses.
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ inputs.version }}
      dry_run: ${{ inputs.dry_run }}
    secrets:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
