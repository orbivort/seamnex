name: release

# The release pipeline. Three entrypoints run these jobs and nothing else defines a release:
# `release-auto.yml` (a merge into `main` that changed the version), `release-dispatch.yml` (a
# maintainer naming a version, or asking for a dry run) and a pushed `vX.Y.Z` tag. One definition
# means an automatic release and a manual one cannot disagree about the gates, the artefacts or the
# notes.
#
# The tag is written here, last, rather than pushed by a caller to re-enter this workflow on `push`:
# a tag pushed with `secrets.GITHUB_TOKEN` starts no workflow, and the alternative — a personal
# access token held to re-enter the same repository — adds a long-lived credential to save nothing.
# Written after the gates and after the packaging, the tag names a commit that already passed and
# whose assets are on disk: it records a release that exists rather than predicting one.
on:
  push:
    tags:
      # v1.2.3 and v1.2.3-rc.1: the second pattern is the pre-release form. These are GitHub filter
      # patterns, not shell globs — `+` means "one or more of the preceding element" there, which is
      # what makes every segment numeric.
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_call:
    inputs:
      version:
        description: 'Version to release: X.Y.Z or X.Y.Z-rc.N (a leading "v" is optional; blank: the version the tree states)'
        required: false
        type: string
      dry_run:
        description: 'Run every gate and build the artefacts, but do not tag or publish'
        required: false
        type: boolean
        default: false
    secrets:
      TURBO_TOKEN:
        required: false
      TURBO_TEAM:
        required: false

# Publishing is not idempotent: a cancelled run can leave a release carrying half of its assets. The
# group is per ref, so two runs on the same ref queue rather than race, and a run for a newer tag
# never cancels an older release that is still uploading.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # No Node version here: `actions/setup-node` reads `node-version-file: .nvmrc`, the same pin
  # `engines.node`/`devEngines` in package.json state and `engineStrict` enforces on install.
  TURBO_TELEMETRY_DISABLED: '1'

# Actions are referenced by major version only (`@v7`, `@v8`), matching `ci.yml`; the note there
# explains the convention and its one exception.

# Least privilege at the workflow level. `tag` and `publish` escalate, each only to `contents: write`,
# the single permission `git push` and `gh release create` need.
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # The version is resolved once, here, and carried to every later job as an output: no job re-derives
  # it and none can disagree. A stated version comes from the caller; a tag names its own; a caller
  # that states nothing releases the version the tree states, which is the number the bump pull
  # request wrote and the one the review approved.
  resolve:
    name: resolve the version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          # `git ls-remote` below needs a remote to ask, and the tree-read path needs the manifests.
          fetch-depth: 0
      - name: install node (.nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # `inputs.version` arrives through the environment rather than as an inline `${{ }}`
      # substitution: a substituted value is pasted into the script before bash parses it, which is
      # how a dispatch input becomes shell. Quoted and read from the environment, it cannot.
      - name: check the version is a version and is not already released
        id: version
        env:
          REQUESTED: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          requested="${REQUESTED#v}"
          if [[ -n "$requested" ]]; then
            # A stated version releases the commit the caller stands on, so that commit has to be a
            # branch head: a tag is already released by definition, and rebadging it is exactly the
            # reuse `CONTRIBUTING.md` forbids.
            if [[ "${GITHUB_REF_TYPE}" != 'branch' ]]; then
              echo "::error::a version input releases from a branch, not from ${GITHUB_REF_TYPE} ${GITHUB_REF_NAME}."
              exit 1
            fi
            version="$requested"
          elif [[ "${GITHUB_REF_TYPE}" == 'tag' ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            # Called with no version: the tree is the request. `scripts/check-version.mjs` is the gate
            # that judges the bump, so it is also the reader of it — a tree whose manifests, contract
            # constant, OpenAPI document or changelog disagree fails here rather than releasing.
            version=$(node scripts/check-version.mjs --print)
            if [[ "$version" == '0.0.0' ]]; then
              echo "::error::the tree carries the 0.0.0 placeholder; there is no version to release."
              exit 1
            fi
          fi
          # Strict SemVer core plus the pre-release form the release notes and `release.yml`'s trigger
          # already use. Leading zeros are refused (SemVer forbids them) and build metadata is refused
          # (`check:version` would reject `+...` on the tag).
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::'$version' is not a version (expected X.Y.Z or X.Y.Z-<pre>)."
            exit 1
          fi
          if [[ "$version" == '0.0.0' ]]; then
            echo "::error::0.0.0 is the manifest placeholder and cannot be released."
            exit 1
          fi
          tag="v$version"
          # A published tag is never moved, deleted or reused (`CONTRIBUTING.md` § Releases). A run
          # started by a pushed tag already carries the one it releases, so only the other two
          # entrypoints ask whether the number is free.
          if [[ "${GITHUB_REF_TYPE}" != 'tag' ]]; then
            if git ls-remote --tags origin "refs/tags/$tag" | grep -q .; then
              echo "::error::tag $tag already exists; pick a new version (a defective release is followed by the next patch)."
              exit 1
            fi
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "::error::a release for $tag already exists."
              exit 1
            fi
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "prerelease=$([[ "$version" == *-* ]] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $tag from ${GITHUB_REF_NAME}@${GITHUB_SHA:0:7}."
      - name: summarise the request
        run: |
          set -euo pipefail
          {
            echo "### Release request: ${{ steps.version.outputs.tag }}"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Version | \`${{ steps.version.outputs.version }}\` |"
            echo "| Pre-release | \`${{ steps.version.outputs.prerelease }}\` |"
            echo "| Source | \`${GITHUB_REF_NAME}\` at \`${GITHUB_SHA:0:7}\` |"
            echo "| Dry run | \`${{ inputs.dry_run }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # The gates are the CI definition, not a restatement of it, and on the usual path they have already
  # run: the released commit is the `main` head the push build gated. A passing run of that exact
  # definition on that exact commit is the same evidence as running the file again, so it is re-used
  # and named in the log. Where there is none — a dispatch against an older commit — the file runs.
  #
  # This job waits, because it starts at the same moment as the run it is looking for: the push that
  # triggered the release is the push that starts `ci.yml`, so asking once would find a run still in
  # progress and re-run the gates it was supposed to replace.
  gate:
    name: gates on this commit
    needs: resolve
    runs-on: ubuntu-latest
    # Long enough for `ci.yml`'s slowest job (the cross-platform matrix) to finish on a cold cache.
    timeout-minutes: 40
    permissions:
      contents: read
      # `gh run list` is the one call here, and reading Actions is the one scope it needs.
      actions: read
    outputs:
      reuse: ${{ steps.find.outputs.reuse }}
    steps:
      - name: wait for the ci.yml run on this commit, then read it
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          pending=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --limit 100 \
            --json status --jq 'any(.[]; .status != "completed")')
          while [[ "$pending" == 'true' ]]; do
            if (( SECONDS > 1800 )); then
              echo "::error::a ci.yml run on ${GITHUB_SHA:0:7} was still running after 30 minutes."
              exit 1
            fi
            echo "Waiting for the ci.yml run on ${GITHUB_SHA:0:7} to finish."
            sleep 20
            pending=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --limit 100 \
              --json status --jq 'any(.[]; .status != "completed")')
          done
          total=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --limit 100 \
            --json databaseId --jq 'length')
          run=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --limit 100 \
            --json conclusion,url --jq '[.[] | select(.conclusion == "success")] | first | .url // ""')
          if [[ -n "$run" ]]; then
            echo 'reuse=true' >> "$GITHUB_OUTPUT"
            echo "Re-using the run that already passed ci.yml on ${GITHUB_SHA:0:7}: $run"
            echo "| Gates | passed on this commit: $run |" >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$total" != '0' ]]; then
            # A release must not publish a commit whose gates are red; re-running them here would only
            # reproduce the failure eleven minutes later.
            echo "::error::ci.yml did not pass on ${GITHUB_SHA:0:7}; a release needs a commit whose gates are green."
            exit 1
          else
            echo 'reuse=false' >> "$GITHUB_OUTPUT"
            echo "No ci.yml run on ${GITHUB_SHA:0:7}; the gates run in this workflow."
            echo "| Gates | none on this commit; running them here |" >> "$GITHUB_STEP_SUMMARY"
          fi

  ci:
    name: CI (all gates) on the released commit
    needs: [resolve, gate]
    # Skipped only when `gate` found the same definition already green on this exact commit. The
    # result is read explicitly so a `gate` that failed does not reach this job through a loose `if`.
    # Quoted because a plain scalar that starts with `!` is a YAML *tag*, not a string: unquoted, the
    # line is a syntax error at parse time, the whole workflow is rejected on push, and the condition
    # never reaches the expression evaluator.
    if: "!cancelled() && needs.gate.result == 'success' && needs.gate.outputs.reuse != 'true'"
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    secrets:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

  package:
    name: build and package
    needs: [resolve, gate, ci]
    # `ci` is skipped when its result was re-used, and a skipped dependency is not a passing one on
    # its own: the results are read explicitly, so this runs only after a green `ci` job or a `gate`
    # that vouched for a green run elsewhere.
    if: >-
      !cancelled() && needs.resolve.result == 'success' && needs.gate.result == 'success' &&
      (needs.ci.result == 'success' || needs.ci.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          # Generated notes walk the commits since the previous tag, so the history and the tags
          # themselves have to be present — a shallow clone has neither.
          fetch-depth: 0
      - name: install pnpm (version from packageManager)
        uses: pnpm/action-setup@v6
      - name: install node (.nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: restore turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: turbo-${{ runner.os }}-${{ github.job }}-
      - name: install dependencies
        run: pnpm install --frozen-lockfile
      # The manifests carry the last released version; the requested version is the identity the image
      # would report, so this asserts that the resolved tag, the tree's copy and the committed
      # documents all name the same release. It is the gate `pnpm check:version` exists for, and it
      # runs here because this is the job that builds the artefacts.
      - name: version gate
        env:
          SEAMNEX_BUILD_VERSION: ${{ needs.resolve.outputs.version }}
        run: pnpm check:version
      # The production build, not the demo build: it typechecks first and refuses to emit a bundle
      # that still contains the mock service worker.
      - name: build production bundles
        run: pnpm build
      # An empty tarball is worse than a red run: a missing output would otherwise be published as a
      # successful release of nothing.
      - name: verify the build produced both SPAs
        run: |
          set -euo pipefail
          for app in portal console; do
            if [[ ! -f "apps/$app/dist/index.html" ]]; then
              echo "::error::apps/$app/dist/index.html is missing — the bundle was not built."
              exit 1
            fi
          done
      # GPL-3.0 §4 and §5: a conveyed copy carries the licence, and §6 makes the corresponding source
      # part of the same distribution. A tarball of `dist/` alone satisfies neither, so the two files
      # are staged next to the bundle instead of staying behind in the repository.
      - name: package each app as a versioned tarball
        run: |
          set -euo pipefail
          mkdir -p release
          for app in portal console; do
            stage="temp/release-$app"
            rm -rf "$stage"
            mkdir -p "$stage"
            cp -R "apps/$app/dist" "$stage/dist"
            cp LICENSE THIRD-PARTY-NOTICES.md "$stage/"
            tar -czf "release/seamnex-$app-${VERSION}.tar.gz" \
              -C "$stage" dist LICENSE THIRD-PARTY-NOTICES.md
          done
          ls -l release
      # An archive that silently lost its licence is a licence violation rather than a packaging
      # detail, and it is invisible in the release notes.
      - name: verify every tarball carries its licence
        run: |
          set -euo pipefail
          for archive in release/*.tar.gz; do
            listing="$(tar -tzf "$archive")"
            for required in LICENSE THIRD-PARTY-NOTICES.md dist/index.html; do
              if ! grep -qx "$required" <<< "$listing"; then
                echo "::error::$archive does not contain $required — a GPL-3.0 distribution must carry both files."
                exit 1
              fi
            done
          done
          echo "every archive carries LICENSE, THIRD-PARTY-NOTICES.md and its bundle."
      # A published asset nobody can verify is only half an asset: the consumer needs a digest to
      # check the download against, from the same run that produced it.
      - name: write checksums
        run: |
          set -euo pipefail
          cd release
          sha256sum ./*.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: upload packaged artefacts
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: release/*
          retention-days: 7
          # The publish job would otherwise create a release with no assets.
          if-no-files-found: error

  # Tagging comes after packaging on purpose. A tag written before the build would survive a red
  # build, leaving a published-looking version with no assets behind it and no way to reuse the
  # number. Written here, it names a commit that already passed CI and whose artefacts are on disk.
  tag:
    name: create and push the version tag
    needs: [resolve, package]
    # A run started by a pushed tag is already tagged, and a dry run tags nothing: in both cases this
    # job has no work, and `publish` below reads the skipped result rather than inheriting it.
    if: inputs.dry_run != true && github.ref_type != 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: create the annotated tag on the released commit
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          # A re-check of the remote, because `resolve` ran minutes ago: a tag that appeared meanwhile
          # is a concurrent release of the same number, and this run must not move it.
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "::error::$TAG appeared while this run was building; refusing to move a published tag."
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # The released commit, explicitly: an annotated tag follows the commit it names, not
          # whatever `checkout` left on HEAD.
          git tag -a "$TAG" -m "Release ${TAG#v}" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
          echo "Tagged ${GITHUB_SHA:0:7} as $TAG."

  publish:
    name: publish GitHub release
    needs: [resolve, package, tag]
    # `tag` is skipped on the pushed-tag path, where the release is due and the tag already exists; the
    # skipped result is read explicitly so that path still publishes. `--verify-tag` and the commit
    # comparison below are what make the tag's presence a fact rather than an assumption.
    if: >-
      !cancelled() && inputs.dry_run != true && needs.resolve.result == 'success' &&
      needs.package.result == 'success' &&
      (needs.tag.result == 'success' || needs.tag.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The one other write, scoped to the job that needs it.
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The body is the `CHANGELOG.md` section for this version when there is one — the same script on
      # every path, so no entrypoint can publish different notes for the same changelog. The script
      # appends the generated footer (download verification, licence, full-changelog link) from the
      # checksums this run wrote and the tag it is about to create, so no section restates them.
      # `pnpm check:version` in `package` has already refused a bumped tree whose changelog has no such
      # section, so only an unbumped (`0.0.0`) release reaches the fallback here.
      - name: prepare the release body from the changelog
        id: notes
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: node scripts/release-notes.mjs "$VERSION"
      - name: download packaged artefacts
        uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release
      # `--verify-tag` fails rather than silently creating a tag if the previous job's push did not
      # land. The body is whatever the step above prepared; `--generate-notes` covers the case where
      # the changelog had no section for this version.
      - name: create the versioned release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
        run: |
          set -euo pipefail
          # `checkout` does not promise a tag pushed by an earlier job in the same run, so ask for
          # exactly the one this release names before inspecting it.
          git fetch --force origin "+refs/tags/${TAG}:refs/tags/${TAG}"
          # The tag must still point at the commit this run built and packaged.
          if [[ "$(git rev-parse "${TAG}^{commit}")" != "$GITHUB_SHA" ]]; then
            echo "::error::$TAG does not point at $GITHUB_SHA; refusing to publish the wrong commit."
            exit 1
          fi
          args=(--verify-tag --title "$VERSION")
          if [[ -f release-notes.md ]]; then
            args+=(--notes-file release-notes.md)
          else
            args+=(--generate-notes)
          fi
          if [[ "$PRERELEASE" == 'true' ]]; then
            args+=(--prerelease)
          else
            args+=(--latest)
          fi
          gh release create "$TAG" release/* "${args[@]}"
      - name: summarise the published release
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          # `changelog` or `commits`: which step prepared the body is the one fact the run summary
          # cannot recover from the release itself.
          NOTES: ${{ steps.notes.outputs.source }}
        run: |
          set -euo pipefail
          {
            echo "### Released $TAG"
            echo
            echo "Release notes taken from: \`$NOTES\`"
            echo
            echo "| Asset | Bytes |"
            echo "| --- | --- |"
            for f in release/*; do
              printf '| %s | %s |\n' "$(basename "$f")" "$(stat -c%s "$f")"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  # A dry run that silently skipped is indistinguishable from one that passed, so say so in the UI.
  dry-run-report:
    name: dry run (nothing tagged or published)
    needs: [resolve, package]
    if: inputs.dry_run == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: record what a real run would have released
        run: |
          set -euo pipefail
          {
            echo "### Dry run: ${{ needs.resolve.outputs.tag }} was not released"
            echo
            echo "CI passed and the artefacts were built and uploaded as \`release-assets\`."
            echo "Re-run with \`dry_run\` unchecked to tag and publish this version."
          } >> "$GITHUB_STEP_SUMMARY"
