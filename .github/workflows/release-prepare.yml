name: release-prepare

# The maintainer-facing half of a release: it turns the version named in the Actions UI into a
# reviewable pull request that carries that version in every manifest, in `CONTRACT_DOCUMENT_VERSION`
# (and so in the committed `docs/openapi.json`) and in `CHANGELOG.md`.
#
# It never tags and never publishes. `release.yml` still cuts the release from a commit, and
# `release-auto.yml` runs it when the `main` push this pull request becomes changes the version; this
# workflow only removes the hand edit that used to happen before them, and puts it behind review.
# A version that is already tagged is refused, so this cannot rewrite a past release — and the branch
# it pushes is a pull-request branch, not a protected one.
#
# The number writing itself lives in `scripts/bump-version.mjs`, not in this file: the same command
# prepares a release by hand, and `pnpm check:version` is the gate that reads the result back.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for the pull request: X.Y.Z or X.Y.Z-rc.N (a leading "v" is optional)'
        required: true
        type: string

# Two bumps running together would race for the same branch name; the second should queue behind the
# first rather than cancel a half-written tree.
concurrency:
  group: release-prepare
  cancel-in-progress: false

env:
  # No Node version here: `actions/setup-node` reads `node-version-file: .nvmrc`, the same pin
  # `engines.node`/`devEngines` in package.json state and `engineStrict` enforces on install.
  TURBO_TELEMETRY_DISABLED: '1'

# Least privilege at the workflow level. `bump` escalates once, to exactly what pushing a branch,
# dispatching `ci.yml` on it and opening a pull request need — no `contents: write` on the fetch that
# precedes it.
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  bump:
    name: bump, verify and open the pull request
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # `actions: write` belongs to the fallback below, not to the bump: it is what `gh workflow run`
    # needs to put a CI run on a branch whose pull request `GITHUB_TOKEN` opened. With the optional
    # release app credential configured, the pull request starts its own run and no dispatch happens.
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      # Presence check for the optional app credential, which is what turns the pre-merge gates into
      # checks on the pull request. Only this id is visible to every step; the private key is passed to
      # the one step that uses it, never exported to the job.
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          # The branch is pushed back and the diff is read locally, so the clone needs both history
          # and the branch ref rather than the default detached commit.
          fetch-depth: 0
      # `inputs.version` arrives through the environment rather than as an inline `${{ }}`
      # substitution: a substituted value is pasted into the script before bash parses it, which is
      # how a dispatch input becomes shell. Quoted and read from the environment, it cannot.
      - name: validate the requested version
        id: version
        env:
          RAW_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${RAW_VERSION#v}"
          # The same strict SemVer core `release-dispatch.yml` accepts, so any version this workflow
          # writes can be tagged by that workflow afterwards without a second opinion.
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::'$RAW_VERSION' is not a version (expected X.Y.Z or X.Y.Z-<pre>)."
            exit 1
          fi
          if [[ "$version" == '0.0.0' ]]; then
            echo "::error::0.0.0 is the placeholder this workflow exists to replace."
            exit 1
          fi
          # Both checks are remote: a local answer only describes the clone, and the clone is
          # minutes old at best.
          if [[ "${GITHUB_REF_TYPE}" != 'branch' ]]; then
            echo "::error::run this workflow from a branch, not from ${GITHUB_REF_TYPE} ${GITHUB_REF_NAME}."
            exit 1
          fi
          # `main` is the branch `ci.yml` gates and `release.yml` tags from. Prepared on a feature
          # branch, the release pull request would target that branch instead, and the bump would
          # reach `main` — and a tag — by a route nothing here reviews.
          if [[ "${GITHUB_REF_NAME}" != 'main' ]]; then
            echo "::error::run this workflow from main, not from ${GITHUB_REF_NAME}."
            exit 1
          fi
          branch="release/v${version}"
          if git ls-remote --heads origin "refs/heads/$branch" | grep -q .; then
            echo "::error::$branch already exists; close the pull request it belongs to, or pick another version."
            exit 1
          fi
          if git ls-remote --tags origin "refs/tags/v$version" | grep -q .; then
            echo "::error::tag v$version already exists; a released version is never bumped again."
            exit 1
          fi
          {
            echo "version=$version"
            echo "branch=$branch"
            echo "date=$(date -u +%F)"
          } >> "$GITHUB_OUTPUT"
          echo "Preparing $version for review from ${GITHUB_REF_NAME}@${GITHUB_SHA:0:7}."
      - name: install pnpm (version from packageManager)
        uses: pnpm/action-setup@v6
      - name: install node (.nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: install dependencies
        run: pnpm install --frozen-lockfile
      - name: bump the manifests, the contract constant and the changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DATE: ${{ steps.version.outputs.date }}
        run: node scripts/bump-version.mjs "$VERSION" --date "$DATE"
      # The document is generated, never hand-edited (ADR-BE-01), and its `info.version` comes from
      # the constant the previous step rewrote. Regenerating is the only way the committed file stays
      # byte-identical to what the API serves — the assertion `contract parity` makes.
      - name: regenerate the committed OpenAPI document
        run: pnpm --filter @seamnex/api openapi:generate
      # The bump is verified by the gate that will judge the pull request, not by a second opinion
      # written here. Staging happens in the same step so the diff that was checked is the diff that
      # is committed.
      - name: verify the bump is consistent and complete
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DATE: ${{ steps.version.outputs.date }}
        run: |
          set -euo pipefail
          pnpm check:version
          git add -A
          changed=$(git diff --cached --name-only)
          if [[ -z "$changed" ]]; then
            echo "::error::nothing changed; the tree already carries $VERSION."
            exit 1
          fi
          # Anything outside the version surface is an edit the bump had no business making, and a
          # reviewer would have to find it. The allowlist is the whole footprint of the script.
          unexpected=$(printf '%s\n' "$changed" | grep -Ev '^(package\.json|(apps|packages)/[^/]+/package\.json|CHANGELOG\.md|docs\/openapi\.json|packages/domain/src/contract\.ts)$' || true)
          if [[ -n "$unexpected" ]]; then
            echo "::error::the bump touched files outside the version surface:"
            printf '%s\n' "$unexpected"
            exit 1
          fi
          grep -Fq "\"version\": \"$VERSION\"" docs/openapi.json || {
            echo "::error::docs/openapi.json does not carry $VERSION after regeneration."
            exit 1
          }
          grep -Fq "## [$VERSION] - $DATE" CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no '## [$VERSION] - $DATE' section."
            exit 1
          }
          printf 'Changed by the bump:\n%s\n' "$changed"
          git diff --cached --stat
      - name: commit and push the branch
        id: push
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BRANCH: ${{ steps.version.outputs.branch }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --create "$BRANCH"
          git commit -m "chore(release): v$VERSION"
          git push origin "refs/heads/$BRANCH"
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Pushed $BRANCH at ${sha:0:7}."
      # A pull request opened with `GITHUB_TOKEN` starts no `pull_request` workflow, and that event is
      # the only way the gates arrive as check runs — the form branch protection evaluates. An app
      # credential fixes the cause; without one, the fallback below dispatches `ci.yml` on the branch,
      # which is attached to the branch rather than to the pull request but is otherwise the same run.
      - name: mint a token whose pull request starts workflows
        id: bot
        if: env.RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ env.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Opening the pull request is all this token does; pushing keeps the workflow's own token.
          permission-pull-requests: write
      - name: start the CI run on the release branch
        if: env.RELEASE_APP_ID == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.version.outputs.branch }}
          SHA: ${{ steps.push.outputs.sha }}
        run: |
          set -euo pipefail
          # Idempotent, because re-running a failed job re-runs this step: a second dispatch for the
          # same commit is a duplicate run, and `ci.yml` cancels one of the two halfway through.
          existing=$(gh run list --workflow ci.yml --commit "$SHA" --limit 100 --json databaseId --jq 'length')
          if [[ "$existing" != '0' ]]; then
            echo "ci.yml already has a run on ${SHA:0:7}; not dispatching another."
            exit 0
          fi
          gh workflow run ci.yml --ref "$BRANCH"
          echo "Dispatched ci.yml on $BRANCH (a pull request opened with GITHUB_TOKEN starts none)."
      # A pull request is the deliverable, so its body says what a reviewer has to check and what
      # happens after the merge. `--body-file` keeps the Markdown out of the YAML.
      - name: open the pull request
        id: pull-request
        env:
          # The app token when there is one, because the actor of `gh pr create` is what decides
          # whether this pull request starts its own workflow run.
          GH_TOKEN: ${{ steps.bot.outputs.token || secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          BRANCH: ${{ steps.version.outputs.branch }}
          DATE: ${{ steps.version.outputs.date }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/release-prepare.md"
          # Which gate the reviewer will see is the one difference the app credential makes, so the
          # body states which one applies instead of describing the fallback as if it were the rule.
          if [[ -n "${RELEASE_APP_ID}" ]]; then
            ci_note="\`ci.yml\` started from this pull request's own \`pull_request\` event, so the gates are check runs on this pull request and can be required before merge."
          else
            ci_note="\`ci.yml\` was dispatched on \`$BRANCH\` after the push, because a pull request opened with \`GITHUB_TOKEN\` does not start \`pull_request\` workflows. That run is attached to the branch rather than to this pull request; re-dispatch it from the Actions tab if it did not start. Configuring the release app credential turns it into a required check."
          fi
          {
            echo "## Release preparation: \`v$VERSION\`"
            echo
            echo "Generated by \`.github/workflows/release-prepare.yml\` from \`${GITHUB_REF_NAME}@${GITHUB_SHA:0:7}\`. Merging this pull request is what makes \`v$VERSION\` the version the repository states about itself."
            echo
            echo "| File | Result |"
            echo "| --- | --- |"
            for file in $(git show --name-only --pretty=format: HEAD); do
              case "$file" in
                CHANGELOG.md)
                  result="\`## [Unreleased]\` -> \`## [$VERSION] - $DATE\`, with a fresh \`## [Unreleased]\` section above it and the link definitions moved to \`v$VERSION\`"
                  ;;
                packages/domain/src/contract.ts)
                  result="\`CONTRACT_DOCUMENT_VERSION\` -> \`$VERSION\`"
                  ;;
                docs/openapi.json)
                  result="regenerated from that constant, so \`info.version\` is \`$VERSION\`"
                  ;;
                *)
                  result="\`version\` -> \`$VERSION\`"
                  ;;
              esac
              echo "| \`$file\` | $result |"
            done
            echo
            echo "### What to review"
            echo
            echo "- Every manifest carries the same number, and \`pnpm check:version\` is green in this run."
            echo "- The changelog entries under \`## [Unreleased]\` are the ones meant for \`v$VERSION\`; nothing was reworded, only the heading moved."
            echo "- \`docs/openapi.json\` differs only in \`info.version\`."
            echo
            echo "### After merge"
            echo
            echo "Merging this pull request releases it. \`release-auto.yml\` runs on the \`main\` push this becomes, re-uses the CI run already green on that commit (or runs the gates itself when there is none), packages the artefacts, tags \`v$VERSION\` and publishes the release with the \`## [$VERSION]\` section of \`CHANGELOG.md\` as its body."
            echo
            echo "To retry a release that failed after the merge, run \`release-dispatch.yml\` with \`$VERSION\`: no version change follows, so nothing re-triggers the automatic path."
            echo
            echo "### CI on this pull request"
            echo
            echo "$ci_note"
          } > "$body"
          url=$(gh pr create --base "$GITHUB_REF_NAME" --head "$BRANCH" --title "chore(release): v$VERSION" --body-file "$body")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Opened $url."
      - name: summarise the request
        if: always()
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BRANCH: ${{ steps.version.outputs.branch }}
          DATE: ${{ steps.version.outputs.date }}
          URL: ${{ steps.pull-request.outputs.url }}
        run: |
          set -euo pipefail
          {
            echo "### Version bump: \`v$VERSION\`"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Version | \`$VERSION\` |"
            echo "| Changelog heading | \`## [$VERSION] - $DATE\` |"
            echo "| Branch | \`$BRANCH\` |"
            echo "| Pull request | ${URL:-not opened} |"
          } >> "$GITHUB_STEP_SUMMARY"
